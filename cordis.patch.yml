# dsh-initiative 的加载行（这个文件属于包本身，随 dsh.profile.bundles 自动生效，不要手改）。
#
# 安装：dsh plugin --profile <名字> add <本包路径>
#       → 包名被写进 profile 的 dsh.profile.bundles → 本文件自动插入下面这一行。
# 启用：默认 enabled=false，**必须**在 **profile 的** cordis.patch.yml 用覆盖行打开：
#   - id: initiative
#     name: 'dsh-initiative'
#     config:
#       enabled: true
#       sessionId: '目标会话 id'
- insert:
    - id: initiative
      name: 'dsh-initiative'
